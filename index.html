    // --- CANVAS PARTICULES D'ÉPICES ---
    const SpiceParticleBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = [];
        const colors = ['#C2593F', '#E0A93B', '#E05A2B', '#3F5E4D', '#D57C66'];

        for (let i = 0; i < 45; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2.5 + 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            vx: (Math.random() - 0.5) * 0.4,
            vy: Math.random() * 0.6 + 0.2,
            opacity: Math.random() * 0.4 + 0.15,
            spin: Math.random() * Math.PI * 2,
            vSpin: (Math.random() - 0.5) * 0.02
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.spin += p.vSpin;

            if (p.y > height + 10) {
              p.y = -10;
              p.x = Math.random() * width;
            }
            if (p.x < -10) p.x = width + 10;
            if (p.x > width + 10) p.x = -10;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.spin);
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = p.color;

            // Forme organique (grain d'épice ovale ou losange)
            ctx.beginPath();
            ctx.ellipse(0, 0, p.radius * 1.5, p.radius, p.spin, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-60" />;
    };

        setToast({ message, type });

      // Gestion du panier
      const addToCart = (spice, quantity = 1, format = null) => {
        const itemFormat = format || spice.unit;
        const cartItemId = `${spice.id}-${itemFormat}`;

        setCart((prev) => {
          const existing = prev.find((item) => item.cartItemId === cartItemId);
          if (existing) {
            return prev.map((item) =>
              item.cartItemId === cartItemId
                ? { ...item, quantity: item.quantity + quantity }
                : item
            );
          }
          return [
            ...prev,
            {
              cartItemId,
              spiceId: spice.id,
              name: spice.name,
              price: spice.price,
              format: itemFormat,
              quantity,
              color: spice.color,
              image: spice.image
            }
          ];
        });

        showToast(`Ajouté au panier : ${spice.name} (x${quantity})`);
      };

      const updateCartQuantity = (cartItemId, delta) => {
        setCart((prev) =>

            .map((item) => {
              if (item.cartItemId === cartItemId) {
                const newQ = item.quantity + delta;
                return newQ > 0 ? { ...item, quantity: newQ } : null;
              }
              return item;
            })
            .filter(Boolean)

              <button onClick={onClose} className="text-charcoal-400 hover:text-charcoal-900 font-bold text-lg">
                ✕
              </button>

            {/* Liste des Articles */}

                  <p className="text-xs">Laissez-vous tenter par nos mélanges d'exception !</p>

                cart.map((item) => (

                    <img src={item.image} alt={item.name} className="w-14 h-14 rounded-lg object-cover" />

                        +

                      onClick={() => onRemoveItem(item.cartItemId)}

              )}
            </div>

            {/* Pied de Panier & Checkout */}
            {cart.length > 0 && (
              <div className="p-6 border-t border-sand-200 bg-sand-50 space-y-4">
                <div className="flex justify-between text-sm text-charcoal-700">
                  <span>Sous-total</span>
                  <span className="font-serif font-bold text-base text-charcoal-900">{cartSubtotal.toFixed(2)} €</span>

                  Passer la Commande →

              </div>
            )}

          </div>
        </div>
      );

    // =========================================================================
    // COMPOSANT 6 : TUNNEL DE COMMANDE / CHECKOUT
    // =========================================================================
    function CheckoutView({ cart, cartSubtotal, onUpdateQuantity, onRemoveItem, onOrderCompleted, onBackToCatalog }) {
      const [packaging, setPackaging] = useState('lin');
      const [notes, setNotes] = useState('');
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        phone: '',
        address: '',
        city: '',
        postalCode: ''
      });

      const packagingFee = packaging === 'bois' ? 5.00 : 0.00;
      const shippingFee = cartSubtotal >= 60 || cartSubtotal === 0 ? 0.00 : 4.90;
      const total = cartSubtotal + packagingFee + shippingFee;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.email || !formData.address) {
          alert('Veuillez renseigner les coordonnées de livraison.');
          return;
        }

        const newOrder = {
          id: `DJ-2026-${Math.floor(1000 + Math.random() * 9000)}`,
          customer: formData,
          items: cart,
          packaging: packaging === 'bois' ? "Coffret Bois d'Acacia Gravé (+5.00€)" : "Pochon en Lin Écologique",
          packagingFee,
          shippingFee,
          subtotal: cartSubtotal,
          total,
          status: "En attente",
          createdAt: new Date().toISOString(),
          notes
        };

        onOrderCompleted(newOrder);
      };

      if (cart.length === 0) {
        return (
          <div className="max-w-xl mx-auto px-4 py-20 text-center space-y-4">
            <span className="text-5xl block">🛍️</span>
            <h2 className="text-2xl font-serif font-bold text-charcoal-900">Votre panier est vide</h2>
            <p className="text-sm text-charcoal-600">Sélectionnez quelques épices avant de finaliser votre commande.</p>
            <button
              onClick={onBackToCatalog}
              className="px-6 py-3 rounded-xl bg-paprika text-white text-sm font-bold shadow-md"
            >
              Retourner au Catalogue
            </button>
          </div>
        );

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">

            <span className="text-xs uppercase tracking-widest text-paprika font-bold">Étape Finale</span>
            <h1 className="text-3xl sm:text-4xl font-serif font-bold text-charcoal-900">Passer une Commande</h1>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* Formulaire de Livraison */}
            <form onSubmit={handleSubmit} className="lg:col-span-7 bg-white p-6 sm:p-8 rounded-3xl border border-sand-300 shadow-sm space-y-6">

                    type="text"

                    placeholder="Jean Dupont"
                    value={formData.name}

                    className="w-full p-3 rounded-xl bg-sand-50 border border-sand-300 text-sm focus:outline-none focus:border-paprika"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-charcoal-700 block mb-1">Email *</label>
                  <input
                    type="email"
                    required
                    placeholder="jean@gastronomie.fr"

                  />

              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">

                  <label className="text-xs font-bold text-charcoal-700 block mb-1">Téléphone</label>

                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-charcoal-700 block mb-1">Adresse postale *</label>
                  <input
                    type="text"

                      packaging === 'bois' ? 'bg-paprika-50 border-paprika text-paprika font-bold' : 'bg-sand-50 border-sand-300'
                    }`}

                    <span>🎁</span>
                    <span className="text-xs">Coffret Bois Gravé (+5.00€)</span>
                  </div>
                </div>
              </div>

              {/* Note / Instruction */}
              <div>
                <label className="text-xs font-bold text-charcoal-700 block mb-1">Message ou note personnalisée</label>

    function AdminDashboardView({ orders, spices, onUpdateOrderStatus }) {
      const [filterStatus, setFilterStatus] = useState('Tous');

      const filteredOrders = filterStatus === 'Tous'
        ? orders
        : orders.filter(o => o.status === filterStatus);

      const totalRevenue = orders.reduce((sum, o) => sum + o.total, 0);
      const pendingCount = orders.filter(o => o.status === 'En attente' || o.status === 'En préparation').length;
      const lowStockItems = spices.filter(s => s.inStock <= 20);

      const statusColors = {
        'En attente': 'bg-turmeric/20 text-turmeric-800 border-turmeric/40',
        'En préparation': 'bg-paprika/15 text-paprika-800 border-paprika/30',
        'Expédiée': 'bg-blue-100 text-blue-800 border-blue-300',
        'Livrée': 'bg-cardamom/20 text-cardamom-800 border-cardamom/40'

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">

            <div className="bg-white p-6 rounded-2xl border border-sand-300 shadow-sm space-y-1">
              <span className="text-xs text-charcoal-500 font-bold uppercase">Total Commandes</span>
              <div className="text-3xl font-serif font-bold text-charcoal-900">{orders.length}</div>

            <div className="bg-white p-6 rounded-2xl border border-sand-300 shadow-sm space-y-1">
              <span className="text-xs text-charcoal-500 font-bold uppercase">À Traiter</span>
              <div className="text-3xl font-serif font-bold text-turmeric-700">{pendingCount}</div>
              <span className="text-[11px] text-turmeric-800 font-medium">Priorité expédition</span>
            </div>
            <div className="bg-white p-6 rounded-2xl border border-sand-300 shadow-sm space-y-1">
              <span className="text-xs text-charcoal-500 font-bold uppercase">Alertes Stock Rares</span>
              <div className="text-3xl font-serif font-bold text-saffron">{lowStockItems.length}</div>
              <span className="text-[11px] text-saffron font-medium">Safran & Poivres de Kampot</span>
            </div>
          </div>

          {/* Filtres par Statut */}
          <div className="flex items-center gap-2 overflow-x-auto pb-2">
            {['Tous', 'En attente', 'En préparation', 'Expédiée', 'Livrée'].map((st) => (
              <button
                key={st}
                onClick={() => setFilterStatus(st)}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                  filterStatus === st
                    ? 'bg-charcoal-900 text-white shadow-md'
                    : 'bg-sand-200 text-charcoal-700 hover:bg-sand-300'
                }`}
              >
                {st}
              </button>
            ))}
          </div>

          {/* Tableau des Commandes */}
          <div className="bg-white rounded-3xl border border-sand-300 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-charcoal-700">

                  <tr>
                    <th className="p-4">N° Commande</th>
                    <th className="p-4">Client</th>
                    <th className="p-4">Articles</th>
                    <th className="p-4">Montant</th>
                    <th className="p-4">Date</th>
                    <th className="p-4">Statut Actuel</th>
                    <th className="p-4 text-right">Mettre à Jour</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-sand-200">
                  {filteredOrders.map((order) => (
                    <tr key={order.id} className="hover:bg-sand-50 transition-colors">
                      <td className="p-4 font-mono font-bold text-charcoal-900">{order.id}</td>
                      <td className="p-4">

                      <td className="p-4 font-serif font-bold text-charcoal-900 text-sm">
                        {order.total.toFixed(2)} €

                      <td className="p-4 text-charcoal-500">

                      <td className="p-4">
                        <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold border ${statusColors[order.status] || 'bg-sand-200'}`}>
                          {order.status}
                        </span>
                      </td>
                      <td className="p-4 text-right">
                        <select
                          value={order.status}
                          onChange={(e) => onUpdateOrderStatus(order.id, e.target.value)}

                        >
                          <option value="En attente">En attente</option>
                          <option value="En préparation">En préparation</option>
                          <option value="Expédiée">Expédiée</option>
                          <option value="Livrée">Livrée</option>
                        </select>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }
